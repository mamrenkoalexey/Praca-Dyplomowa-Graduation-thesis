<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout.html">
<head>
    <title>FAST BUY CAR | Salony</title>
</head>

<body>
<div layout:fragment="content" class="bg-gray-950 text-white font-sans">

    <!-- Header Section -->
    <section class="text-center py-4 bg-gradient-dark">
        <div class="container">
            <h2 class="display-5 fw-bold mb-3 gradient-heading">Znajdź salon najbliżej Ciebie</h2>
            <p class="text-secondary mb-0 fw-bold" style="font-size: 1.1rem;">
                Odwiedź nasze salony i zobacz samochody na żywo
            </p>
        </div>
    </section>

    <hr class="section-divider" style="margin-top: 0px; margin-bottom: 20px;">

    <!-- Salons Grid -->
    <section class="container py-4">
        <div th:if="${salons != null && !#lists.isEmpty(salons)}" class="row g-4">
            <div class="col-sm-6 col-lg-4" th:each="salon : ${salons}">
                <a th:href="@{/salon/{id}(id=${salon.id})}" class="card-link">
                    <div class="card bg-black border border-secondary h-100 shadow-sm car-card">
                        <div class="card-body">
                            <!-- Salon Header -->
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <h3 class="card-title text-light fw-bold mb-0" th:text="${salon.name}">
                                    Nazwa salonu
                                </h3>
                                <span th:if="${salon.active}" class="badge bg-success">Aktywny</span>
                                <span th:if="${!salon.active}" class="badge bg-danger">Nieaktywny</span>
                            </div>

                            <!-- City -->
                            <div class="mb-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-geo-alt-fill text-primary me-2" viewBox="0 0 16 16" style="vertical-align: middle;">
                                    <path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"/>
                                </svg>
                                <span class="text-secondary">
                                    <strong>Miasto:</strong> <span th:text="${salon.city}">Warszawa</span>
                                </span>
                            </div>

                            <!-- Address -->
                            <div class="mb-3">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-house-fill text-primary me-2" viewBox="0 0 16 16" style="vertical-align: middle;">
                                    <path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L8 2.207l6.646 6.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293z"/>
                                    <path d="m8 3.293 6 6V13.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 13.5V9.293z"/>
                                </svg>
                                <span class="text-secondary">
                                    <span th:text="${salon.street + ' ' + salon.buildingNumber}">ul. Główna 1</span>
                                </span>
                            </div>

                            <!-- Phone -->
                            <div class="mb-3">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-telephone-fill text-primary me-2" viewBox="0 0 16 16" style="vertical-align: middle;">
                                    <path fill-rule="evenodd" d="M1.885.511a1.745 1.745 0 0 1 2.61.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.68.68 0 0 0 .178.643l2.457 2.457a.68.68 0 0 0 .644.178l2.189-.547a1.75 1.75 0 0 1 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.6 18.6 0 0 1-7.01-4.42 18.6 18.6 0 0 1-4.42-7.009c-.362-1.03-.037-2.137.703-2.877z"/>
                                </svg>
                                <span class="text-secondary">
                                    <span th:text="${salon.phone}">+48 123 456 789</span>
                                </span>
                            </div>

                            <hr class="border-secondary my-3">

                            <!-- Cars Count -->
                            <div class="d-flex align-items-center">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-car-front text-primary me-2" viewBox="0 0 16 16">
                                    <path d="M4 9a1 1 0 1 1-2 0 1 1 0 0 1 2 0m10 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0M6 8a1 1 0 0 0 0 2h4a1 1 0 1 0 0-2zM4.862 4.276 3.906 6.19a.51.51 0 0 0 .497.731c.91-.073 2.35-.17 3.597-.17s2.688.097 3.597.17a.51.51 0 0 0 .497-.731l-.956-1.913A.5.5 0 0 0 10.691 4H5.309a.5.5 0 0 0-.447.276"/>
                                    <path d="M2.52 3.515A2.5 2.5 0 0 1 4.82 2h6.362c1 0 1.904.596 2.298 1.515l.792 1.848c.075.175.21.319.38.404.5.25.855.715.965 1.262l.335 1.679q.05.242.049.49v.413c0 .814-.39 1.543-1 1.997V13.5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-1.338c-1.292.048-2.745.088-4 .088s-2.708-.04-4-.088V13.5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-1.892c-.61-.454-1-1.183-1-1.997v-.413a2.5 2.5 0 0 1 .049-.49l.335-1.68c.11-.546.465-1.012.964-1.261a.8.8 0 0 0 .381-.404l.792-1.848ZM4.82 3a1.5 1.5 0 0 0-1.379.91l-.792 1.847a1.8 1.8 0 0 1-.853.904.8.8 0 0 0-.43.564L1.03 8.904a1.5 1.5 0 0 0-.03.294v.413c0 .796.62 1.448 1.408 1.484 1.555.07 3.786.155 5.592.155s4.037-.084 5.592-.155A1.48 1.48 0 0 0 15 9.611v-.413q0-.148-.03-.294l-.335-1.68a.8.8 0 0 0-.43-.563 1.8 1.8 0 0 1-.853-.904l-.792-1.848A1.5 1.5 0 0 0 11.18 3z"/>
                                </svg>
                                <span class="text-light fw-semibold"
                                      th:text="${salon.cars != null ? salon.cars.size() : 0} + ' dostępnych samochodów'">
                                    0 dostępnych samochodów
                                </span>
                            </div>
                        </div>

                        <div class="card-footer bg-transparent border-secondary">
                            <small class="text-primary fw-semibold">Kliknij, aby zobaczyć szczegóły i mapę</small>
                        </div>
                    </div>
                </a>
            </div>
        </div>

        <!-- No Salons Message -->
        <div th:if="${salons == null || #lists.isEmpty(salons)}" class="info-content">
            <p class="text-center mb-0">
                Obecnie nie ma dostępnych salonów.
            </p>
        </div>
    </section>

</div>
</body>
</html>
