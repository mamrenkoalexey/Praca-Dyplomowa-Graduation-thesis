<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="navbar">
    <header class="d-flex align-items-center justify-content-between px-4 py-3 border-bottom border-secondary bg-black">
        <h1 class="fs-3 fw-bold text-primary mb-0">
            <a th:href="@{/}" class="text-decoration-none text-primary">Fast Buy Car</a>
        </h1>

        <nav class="d-none d-md-flex align-items-center gap-4">

            <a th:href="@{/}" class="text-decoration-none text-light">Strona Główna</a>

            <!-- Seller Dropdown Menu -->
            <div sec:authorize="hasAnyRole('SELLER', 'MANAGER', 'DIRECTOR')" class="dropdown">
                <a class="text-decoration-none text-light dropdown-toggle" href="#" role="button"
                   id="sellerDropdown" data-bs-toggle="dropdown" aria-expanded="false"
                   style="cursor: pointer;">
                    Sprzedaż
                </a>
                <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="sellerDropdown" style="z-index: 99999 !important">
                    <li>
                        <a class="dropdown-item" th:href="@{/seller/sales}">Sprzedaż</a>
                    </li>
                    <li>
                        <a class="dropdown-item" th:href="@{/seller/leases}">Leasing</a>
                    </li>
                    <li>
                        <a class="dropdown-item" th:href="@{/seller/rents}">Wynajem</a>
                    </li>
                </ul>
            </div>

            <!-- Manager Dropdown Menu -->
            <div sec:authorize="hasAnyRole('MANAGER', 'DIRECTOR')" class="dropdown">
                <a class="text-decoration-none text-light dropdown-toggle" href="#" role="button"
                   id="managerDropdown" data-bs-toggle="dropdown" aria-expanded="false"
                   style="cursor: pointer;">
                    Zarządzanie
                </a>
                <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="managerDropdown" style="z-index: 99999 !important">
                    <li>
                        <a class="dropdown-item" th:href="@{/manager/payments}">Płatności</a>
                    </li>
                    <li>
                        <a class="dropdown-item" th:href="@{/manager/car-stats}">Zarządzaj Samochodami</a>
                    </li>
                    <li>
                        <a class="dropdown-item" th:href="@{/manager/clients}">Zarządzaj Klientami</a>
                    </li>
                    <li sec:authorize="hasRole('DIRECTOR')">
                        <a class="dropdown-item" th:href="@{/director/employees}">Zarządzaj Pracownikami</a>
                    </li>
                </ul>
            </div>

            <!-- Director Dropdown Menu -->
            <div sec:authorize="hasRole('DIRECTOR')" class="dropdown">
                <a class="text-decoration-none text-light dropdown-toggle" href="#" role="button"
                   id="directorDropdown" data-bs-toggle="dropdown" aria-expanded="false"
                   style="cursor: pointer;">
                    Raporty
                </a>
                <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="directorDropdown" style="z-index: 99999 !important">
                    <li>
                        <a class="dropdown-item" th:href="@{/director/reports}">Raporty Salonu</a>
                    </li>
                </ul>
            </div>

            <div sec:authorize="isAnonymous()">
                <a th:href="@{/login}" class="d-flex align-items-center text-decoration-none text-light">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor"
                         class="bi bi-person me-2" viewBox="0 0 16 16">
                        <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4
                        0 2 2 0 0 1 4 0m4 8c0 1-1 1-1
                        1H3s-1 0-1-1 1-4 6-4 6 3 6
                        4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516
                        10.68 10.289 10 8 10s-3.516.68-4.168
                        1.332c-.678.678-.83 1.418-.832 1.664z"/>
                    </svg>
                    Zaloguj się / Zarejestruj się
                </a>
            </div>

            <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-3 text-light">
                <span>
                    <strong th:text="${#authentication.principal.displayName}">Użytkownik</strong>
                </span>
                <a th:href="@{/profile}" class="btn btn-outline-light btn-sm">Mój profil</a>
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-outline-danger btn-sm">Wyloguj się</button>
                </form>
            </div>

        </nav>
    </header>
</div>
</body>
</html>
