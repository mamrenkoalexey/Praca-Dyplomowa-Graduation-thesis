<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Fast Buy Car</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet"/>

    <th:insert th:replace="~{fragments/select2 :: select2-css}"/>
</head>

<body>
<header>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
</header>

<main>
    <div layout:fragment="content"></div>
</main>

<footer class="footer">
    <div th:replace="~{fragments/contacts :: info}"></div>
</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<th:insert th:replace="~{fragments/select2 :: select2-js}"/>

<script>
    function goBack() {
        const prev = document.referrer;
        if (prev) {
            window.location.href = prev;
        } else {
            window.location.href = '/';
        }
    }

    // Fix dropdown z-index issue
    document.addEventListener('DOMContentLoaded', function() {
        // Ensure all dropdown menus have maximum z-index
        document.querySelectorAll('.dropdown-menu').forEach(function(menu) {
            menu.style.setProperty('z-index', '99999', 'important');
        });

        // When dropdown shows, ensure it has maximum z-index
        document.querySelectorAll('[data-bs-toggle="dropdown"]').forEach(function(dropdownToggle) {
            dropdownToggle.addEventListener('show.bs.dropdown', function (event) {
                setTimeout(function() {
                    const dropdownMenu = event.target.nextElementSibling;
                    if (dropdownMenu && dropdownMenu.classList.contains('dropdown-menu')) {
                        dropdownMenu.style.setProperty('z-index', '99999', 'important');
                        dropdownMenu.style.setProperty('position', 'absolute', 'important');
                    }
                }, 10);
            });
        });
    });
</script>

<th:block layout:fragment="scripts"></th:block>

</body>
</html>
