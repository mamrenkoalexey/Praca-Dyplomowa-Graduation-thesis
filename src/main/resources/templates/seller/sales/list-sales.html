<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout.html">
<head>
    <title>Lista Sprzedaży | FAST BUY CAR</title>
</head>
<body>
<div layout:fragment="content" class="bg-gray-950 text-white font-sans">

    <section class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="gradient-heading">Lista Sprzedaży</h2>
            <a th:href="@{/seller/sales/new}" class="btn btn-primary px-4 py-2 rounded-pill">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-circle me-2" viewBox="0 0 16 16" style="vertical-align: middle;">
                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                    <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
                </svg>
                Nowa Sprzedaż
            </a>
        </div>

        <!-- Statistics Cards -->
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="card bg-black border border-secondary p-4">
                    <h5 class="text-secondary mb-2">Całkowita liczba sprzedaży</h5>
                    <p class="display-5 fw-bold text-primary mb-0" th:text="${totalSales}">0</p>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card bg-black border border-secondary p-4">
                    <h5 class="text-secondary mb-2">Całkowity przychód</h5>
                    <p class="display-5 fw-bold text-success mb-0" th:text="${#numbers.formatDecimal(totalRevenue, 0, 'COMMA', 0, 'POINT') + ' PLN'}">0 PLN</p>
                </div>
            </div>
        </div>

        <!-- Success/Error Messages -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Sales Table -->
        <div class="card bg-black border border-secondary">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-dark table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Data sprzedaży</th>
                                <th>Samochód</th>
                                <th>Klient</th>
                                <th>Pracownik</th>
                                <th>Kwota</th>
                                <th>Metoda płatności</th>
                                <th>Akcje</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(sales)}">
                                <td colspan="8" class="text-center text-secondary">Brak sprzedaży w systemie</td>
                            </tr>
                            <tr th:each="sale : ${sales}">
                                <td th:text="${sale.id}">1</td>
                                <td th:text="${#temporals.format(sale.saleDate, 'dd-MM-yyyy')}">01-01-2024</td>
                                <td>
                                    <span th:text="${sale.car.model.brand.name + ' ' + sale.car.model.name}">Toyota Corolla</span>
                                    <br>
                                    <small class="text-secondary" th:text="${'VIN: ' + sale.car.vin}">VIN: ABC123</small>
                                </td>
                                <td th:text="${sale.client.firstName + ' ' + sale.client.lastName}">Jan Kowalski</td>
                                <td th:text="${sale.employee.firstName + ' ' + sale.employee.lastName}">Anna Nowak</td>
                                <td class="fw-bold text-success" th:text="${#numbers.formatDecimal(sale.totalAmount, 0, 'COMMA', 0, 'POINT') + ' PLN'}">50000 PLN</td>
                                <td>
                                    <span class="badge bg-info" th:text="${sale.paymentMethod.displayName}">Gotówka</span>
                                </td>
                                <td>
                                    <a th:href="@{/seller/sales/{id}(id=${sale.id})}" class="btn btn-sm btn-outline-primary">
                                        Szczegóły
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

</div>
</body>
</html>
