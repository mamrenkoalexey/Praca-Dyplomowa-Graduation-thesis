<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout.html">

<head>
    <meta charset="UTF-8">
    <title>Zarządzaj samochodami</title>
</head>

<body>
<div layout:fragment="content" class="bg-gray-950 text-white font-sans">
    <div class="container py-5">
        <h2 class="text-center mb-4 text-primary">Zmień ten samochód</h2>

        <form th:action="@{/manager/update/car/{id}(id=${car.id})}"
              th:object="${car}"
              method="post"
              enctype="multipart/form-data"
              class="bg-secondary p-4 rounded-4 shadow-lg">

            <input type="hidden" name="_method" value="PUT">

            <div class="row g-4">

                <div class="col-lg-8">

                    <div class="mb-3">
                        <label class="form-label">Model samochodu</label>
                        <select class="form-select" th:field="*{model}" required>
                            <option value="" disabled>Wybierz model</option>
                            <option th:each="model : ${models}"
                                    th:value="${model.id}"
                                    th:text="${model.name + ' (' + model.brand.name + ')'}">
                            </option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Typ nadwozia</label>
                            <select class="form-select" th:field="*{bodyType}" required>
                                <option value="">Wybierz typ</option>
                                <option th:each="type : ${carBodyTypes}"
                                        th:value="${type}"
                                        th:text="${type}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Rodzaj paliwa</label>
                            <select class="form-select" th:field="*{fuelType}" required>
                                <option value="">Wybierz paliwo</option>
                                <option th:each="fuel : ${carFuelTypes}"
                                        th:value="${fuel}"
                                        th:text="${fuel}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Rok produkcji</label>
                            <select class="form-select" th:field="*{productionYear}" required>
                                <option value="">Wybierz rok</option>
                                <option th:each="year : ${carYears}"
                                        th:value="${year}"
                                        th:text="${year}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Kolor</label>
                            <input type="text" class="form-control" th:field="*{color}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Cena (PLN)</label>
                            <input type="number" class="form-control" th:field="*{price}" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Przebieg (km)</label>
                            <input type="number" class="form-control" th:field="*{mileage}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Numer VIN</label>
                            <input type="text" class="form-control" th:field="*{vin}" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Numer rejestracyjny</label>
                            <input type="text" class="form-control" th:field="*{registrationNumber}" required>
                        </div>
                    </div>


                    <div class="row">
                        <div class="col-md-6 mb-2">
                            <label class="form-label ">Salon</label>
                            <select class="form-select" th:field="*{salon}" required>
                                <option th:each="salon : ${salons}"
                                        th:value="${salon.id}"
                                        th:text="${salon.name}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-2">
                            <label class="form-label ">Status</label>
                            <select class="form-select " th:field="*{status}" required>
                                <option th:each="status : ${statuses}"
                                        th:value="${status}"
                                        th:text="${status}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Opis samochodu</label>
                        <textarea class="form-control" th:field="*{description}" rows="2"></textarea>
                    </div>

                </div>

                <div class="col-lg-4 d-flex justify-content-center">

                    <div class="text-center" style="width: 100%; max-width: 320px;">

                        <label class="form-label mb-2 d-block text-center">
                            Aktualne zdjęcie
                        </label>

                        <img th:src="@{'/car/' + ${car.carImage}}"
                             class="img-fluid rounded shadow mb-3"
                             style="max-height: 250px; object-fit: cover;"
                             onerror="this.src='/car.png'">

                        <div class="mt-3">
                            <label class="form-label">Zmień zdjęcie</label>
                            <input type="file" class="form-control"
                                   name="image"
                                   accept="image/png,image/jpeg">
                        </div>

                    </div>
                </div>

                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-success btn-lg px-5">
                        Zapisz zmiany
                    </button>
                    <a href="#" onclick="history.back()"
                       class="btn btn-outline-light btn-lg px-5 ms-3">
                        Powrót
                    </a>
                </div>
            </div>
        </form>
    </div>
</div>
</body>
</html>
