<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout.html">

<head>
    <meta charset="UTF-8">
    <title>Zarządzaj samochodami</title>
    <style>
        .form-section {
            background: #000;
            border-radius: 8px;
            border: 1px solid #6c757d;
            padding: 30px;
        }
        .form-control, .form-select {
            background: #000;
            border: 1px solid #6c757d;
            color: #fff;
            border-radius: 8px;
            padding: 12px 15px;
        }
        .form-control:focus, .form-select:focus {
            background: #000;
            border-color: #0d6efd;
            color: #fff;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
        }
        .form-control::placeholder {
            color: #ffffff;
            opacity: 0.7;
        }
        .form-label {
            color: #6c757d;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 8px;
        }
        .image-preview {
            background: #000;
            border: 1px solid #6c757d;
            border-radius: 8px;
            padding: 20px;
        }
    </style>
</head>

<body>
<div layout:fragment="content" class="bg-gray-950 text-white font-sans">

    <!-- Header Section -->
    <section class="text-center py-4 bg-gradient-dark">
        <div class="container">
            <h2 class="display-5 fw-bold mb-3 gradient-heading">Edytuj Samochód</h2>
            <p class="text-secondary fw-bold mb-0" style="font-size: 1.1rem;">
                Zaktualizuj informacje o pojeździe
            </p>
        </div>
    </section>

    <hr class="section-divider" style="margin-top: 0px; margin-bottom: 40px;">

    <div class="container pb-5">
        <form th:action="@{/manager/update/car/{id}(id=${car.id})}"
              th:object="${car}"
              method="post"
              enctype="multipart/form-data"
              class="form-section">

            <input type="hidden" name="_method" value="PUT">

            <div class="row g-4">

                <div class="col-lg-8">

                    <div class="mb-4">
                        <label class="form-label">
                            <i class="bi bi-car-front me-2"></i>Model samochodu
                        </label>
                        <select class="form-select" th:field="*{model}" required>
                            <option value="" disabled>Wybierz model</option>
                            <option th:each="model : ${models}"
                                    th:value="${model.id}"
                                    th:text="${model.name + ' (' + model.brand.name + ')'}">
                            </option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label">
                                <i class="bi bi-body-text me-2"></i>Typ nadwozia
                            </label>
                            <select class="form-select" th:field="*{bodyType}" required>
                                <option value="">Wybierz typ</option>
                                <option th:each="type : ${carBodyTypes}"
                                        th:value="${type}"
                                        th:text="${type.displayName}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-4">
                            <label class="form-label">
                                <i class="bi bi-fuel-pump me-2"></i>Rodzaj paliwa
                            </label>
                            <select class="form-select" th:field="*{fuelType}" required>
                                <option value="">Wybierz paliwo</option>
                                <option th:each="fuel : ${carFuelTypes}"
                                        th:value="${fuel}"
                                        th:text="${fuel.displayName}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label">
                                <i class="bi bi-calendar-event me-2"></i>Rok produkcji
                            </label>
                            <select class="form-select" th:field="*{productionYear}" required>
                                <option value="">Wybierz rok</option>
                                <option th:each="year : ${carYears}"
                                        th:value="${year}"
                                        th:text="${year}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-4">
                            <label class="form-label">
                                <i class="bi bi-palette me-2"></i>Kolor
                            </label>
                            <input type="text" class="form-control" th:field="*{color}" placeholder="Wprowadź kolor" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label">
                                <i class="bi bi-cash me-2"></i>Cena (PLN)
                            </label>
                            <input type="number" step="1" min="0" class="form-control" th:field="*{price}" placeholder="Tylko liczby całkowite" required>
                        </div>

                        <div class="col-md-6 mb-4">
                            <label class="form-label">
                                <i class="bi bi-speedometer2 me-2"></i>Przebieg (km)
                            </label>
                            <input type="number" class="form-control" th:field="*{mileage}" placeholder="Wprowadź przebieg" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label">
                                <i class="bi bi-upc-scan me-2"></i>Numer VIN
                            </label>
                            <input type="text" class="form-control" th:field="*{vin}" placeholder="17-znakowy numer VIN" required>
                        </div>

                        <div class="col-md-6 mb-4">
                            <label class="form-label">
                                <i class="bi bi-card-text me-2"></i>Numer rejestracyjny
                            </label>
                            <input type="text" class="form-control" th:field="*{registrationNumber}" placeholder="Numer tablicy" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label">
                                <i class="bi bi-building me-2"></i>Salon
                            </label>
                            <select class="form-select" th:field="*{salon}" required>
                                <option th:each="salon : ${salons}"
                                        th:value="${salon.id}"
                                        th:text="${salon.name}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-4">
                            <label class="form-label">
                                <i class="bi bi-check-circle me-2"></i>Status
                            </label>
                            <select class="form-select" th:field="*{status}" required>
                                <option th:each="status : ${statuses}"
                                        th:value="${status}"
                                        th:text="${status}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">
                            <i class="bi bi-text-left me-2"></i>Opis samochodu
                        </label>
                        <textarea class="form-control" th:field="*{description}" rows="4" placeholder="Dodatkowe informacje o pojeździe..."></textarea>
                    </div>

                </div>

                <div class="col-lg-4">
                    <div class="image-preview text-center">
                        <label class="form-label mb-3 d-block">
                            <i class="bi bi-image me-2"></i>Aktualne zdjęcie
                        </label>

                        <img th:src="@{/cars/{img}(img=${car.carImage ?: 'default.png'})}"
                             class="img-fluid rounded shadow mb-3"
                             style="max-height: 250px; object-fit: cover; width: 100%;"
                             onerror="this.src='/car.png'">

                        <div class="mt-4">
                            <label class="form-label">
                                <i class="bi bi-upload me-2"></i>Zmień zdjęcie
                            </label>
                            <input type="file" class="form-control"
                                   name="image"
                                   accept="image/png,image/jpeg">
                        </div>
                    </div>
                </div>

            </div>

            <hr class="section-divider my-4">

            <div class="text-center">
                <button type="submit" class="btn btn-primary btn-lg rounded-pill px-5 me-3">
                    <i class="bi bi-check-circle me-2"></i>Zapisz zmiany
                </button>
                <a href="#" onclick="history.back()"
                   class="btn btn-secondary btn-lg rounded-pill px-5">
                    <i class="bi bi-arrow-left me-2"></i>Powrót
                </a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
