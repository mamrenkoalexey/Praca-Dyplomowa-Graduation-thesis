<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout.html">
<head>
    <meta charset="UTF-8">
    <title>Dodaj Nowy Model</title>
</head>
<body class="bg-dark text-light">

<div layout:fragment="content" class="bg-gray-950 text-white font-sans">
    <div class="container py-5">
        <h2 class="text-center mb-4 text-primary">Dodaj nowy model</h2>

        <form th:action="@{/manager/add-model}" th:object="${newModel}" method="post"
              class="bg-secondary p-4 rounded-4 shadow-lg">
            <div th:if="${errorMessage}" class="alert alert-danger text-center">
                <p th:text="${errorMessage}"></p>
            </div>

            <div class="mb-3">
                <label class="form-label text-light">Nazwa modelu</label>
                <input type="text" class="form-control" th:field="*{name}" placeholder="Wpisz nazwę modelu" required>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <label class="form-label text-light mb-0" style="font-size: 0.95rem;">Marka</label>
                    <a th:href="@{/manager/add-brand}"
                       class="btn btn-sm btn-primary shadow-sm"
                       style="font-weight: 500;">
                        + Dodaj nową markę
                    </a>
                </div>
                <select class="form-select" th:field="*{brand}" required>
                    <option value="" disabled selected>Wybierz markę</option>
                    <option th:each="brand : ${brands}" th:value="${brand.id}" th:text="${brand.name}"></option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label text-light">Generacja</label>
                <input type="text" class="form-control" th:field="*{generation}" placeholder="Np. II, F30, MK7"
                       required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label text-light">Rok produkcji (od)</label>
                    <input type="number" min="1950" max="2025" class="form-control"
                           th:field="*{yearFrom}" placeholder="Np. 2015" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label text-light">Rok produkcji (do)</label>
                    <input type="number" min="1950" max="2025" class="form-control"
                           th:field="*{yearTo}" placeholder="Np. 2020" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label text-light">Generacja</label>
                <input type="text" class="form-control" th:field="*{generation}" placeholder="Np. II, F30, MK7"
                       required>
            </div>


            <div class="text-center mt-4">
                <button type="submit" class="btn btn-success btn-lg px-5">Zapisz</button>
                <a href="#" onclick="goBack()" class="btn btn-outline-light btn-lg px-5 ms-3">Powrót</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
