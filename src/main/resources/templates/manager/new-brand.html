<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout.html">
<head>
    <meta charset="UTF-8">
    <title>Dodaj Nowy Brand</title>
</head>
<body class="bg-dark text-light">

<div layout:fragment="content" class="bg-gray-950 text-white font-sans">
    <div class="container py-5">
        <h2 class="text-center mb-4 text-primary">Dodaj nowy brand</h2>

        <form th:action="@{/manager/add-brand}" th:object="${newBrand}" method="post"
              class="bg-secondary p-4 rounded-4 shadow-lg">
            <div th:if="${errorMessage}" class="alert alert-danger text-center">
                <p th:text="${errorMessage}"></p>
            </div>

            <div class="mb-3">
                <label class="form-label text-light">Nazwa Marki</label>
                <input type="text" class="form-control" th:field="*{name}" placeholder="Wpisz nazwę marke" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-light">Kraj Pochodzenia</label>
                <input type="text" class="form-control" th:field="*{country}" placeholder="Wpisz kraj pochodzenia"
                       required>
            </div>
            <div class="mb-3">
                <label class="form-label text-light">Logo</label>
                <input type="text" class="form-control" th:field="*{logoURL}" placeholder="Wpisz link do logo">
            </div>


            <div class="text-center">
                <button type="submit" class="btn btn-success btn-lg px-5">Zapisz</button>
                <a onclick="goBack()" class="btn btn-outline-light btn-lg px-5 ms-3">Powrót</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
